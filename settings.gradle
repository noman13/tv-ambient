pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // usb-serial-for-android is published on JitPack only; nothing else may come from there.
        maven {
            url 'https://jitpack.io'
            content { includeModule('com.github.mik3y', 'usb-serial-for-android') }
        }
    }
}
rootProject.name = "tv-ambient"
include ':app'
