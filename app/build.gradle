plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing is optional: point -PkeystoreProperties (or the TVAMBIENT_KEYSTORE env var) at a
// keystore.properties file with storeFile, storePassword, keyAlias and keyPassword. Without it the release APK is
// signed with the build container's debug key, which is fine for building and testing your own copy.
def keystorePropsPath = project.findProperty('keystoreProperties') ?: System.getenv('TVAMBIENT_KEYSTORE')
def keystoreProps = null
if (keystorePropsPath && file(keystorePropsPath).exists()) {
    keystoreProps = new Properties()
    file(keystorePropsPath).withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'io.github.noman13.tvambient'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.noman13.tvambient'
        minSdk 26
        targetSdk 34
        versionCode 10000
        versionName '1.0.0'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }

    signingConfigs {
        if (keystoreProps != null) {
            release {
                storeFile file(new File(file(keystorePropsPath).parentFile, keystoreProps['storeFile']))
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreProps != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/*.version', 'kotlin/**', 'DebugProbesKt.bin']
        }
    }

    lint { abortOnError false }
}

// The Rust core (TECHNICAL.md §10): cargo-ndk builds libtvambient.so for both ABIs into src/main/jniLibs
// (gitignored) before Android packages it. Runs inside the build image, where cargo and the NDK are installed.
def buildRust = tasks.register('buildRust', Exec) {
    workingDir rootDir
    commandLine 'cargo', 'ndk', '-t', 'armeabi-v7a', '-t', 'arm64-v8a', '--platform', '26',
            '-o', "${projectDir}/src/main/jniLibs", 'build', '--release', '-p', 'tvambient-jni'
    inputs.files(fileTree("${rootDir}/core/src"), fileTree("${rootDir}/jni/src"), "${rootDir}/Cargo.toml",
            "${rootDir}/core/Cargo.toml", "${rootDir}/jni/Cargo.toml")
    outputs.dir("${projectDir}/src/main/jniLibs")
}
tasks.named('preBuild') { dependsOn buildRust }

dependencies {
    // USB serial drivers (CH340/CH341, CP210x, FTDI, PL2303, CDC-ACM), MIT.
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.1'
}
